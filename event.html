<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>事件 · HOMO_eew 推算紀錄</title>
  <link rel="stylesheet" href="site.css?v=mx0arl24" />
</head>
<body>
  <main>
    <header class="site">
      <div>
        <h1 id="title">載入中…</h1>
        <div class="muted" id="meta"></div>
      </div>
      <span><a href="stats.html">統計</a>・<a href="./">← 所有事件</a></span>
    </header>
    <div class="card verify" id="verify" hidden></div>
    <div class="summary" id="summary"></div>

    <div id="shake" hidden></div>

    <div id="conv">
    <h2 style="font-size:16px;margin:0 0 6px" id="conv-title">和中央氣象署對照</h2>
    <p class="note" id="conv-note" hidden></p>
    <div class="legend-inline">
      <span class="key"><span class="swatch-line"></span>每一報的推算</span>
      <span class="key"><span class="swatch-truth" id="legend-ref-swatch"></span><span id="legend-ref">中央氣象署</span></span>
      <span class="key"><span class="swatch-hollow"></span>規模純P</span>
    </div>
    <div class="charts">
      <section class="card chart"><h2 id="t-epi">震央誤差</h2><p class="desc" id="d-epi">每一報的震央離中央氣象署震央多遠，越接近 0 越準</p><div id="c-epi"></div></section>
      <section class="card chart"><h2>規模</h2><p class="desc" id="d-mag">每一報的規模，虛線是中央氣象署</p><div id="c-mag"></div></section>
      <section class="card chart"><h2>深度</h2><p class="desc" id="d-depth">每一報的深度，虛線是中央氣象署</p><div id="c-depth"></div></section>
      <section class="card chart"><h2>觸發站數</h2><p class="desc">每一報時事件裡有幾站</p><div id="c-st"></div></section>
    </div>
    </div>

    <section class="card" style="margin-bottom:12px">
      <h2 style="font-size:14px;margin:0 0 8px">每一報</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>報</th><th class="r">觸發後 s</th><th class="r">發震後 s</th><th>震央</th><th class="r" id="th-epi">震央誤差 km</th>
              <th class="r">深度 km</th><th class="r">規模</th><th class="r">站數</th><th class="r">P/S/O</th><th class="r">最大 PGA gal</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <p class="note">以上是程式自動推算的結果，沒有人工檢查；地震資訊請以中央氣象署公布的為準。</p>
    </section>
    <section class="card">
      <h2 style="font-size:14px;margin:0 0 2px">各站最大加速度</h2>
      <p class="note" style="margin:0 0 8px">這個事件裡搖最大的前 30 站（震度由 PGA 換算，只是參考）</p>
      <div class="table-wrap">
        <table>
          <thead><tr><th>測站</th><th class="r">震央距 km</th><th class="r">PGA gal</th><th class="r">震度</th></tr></thead>
          <tbody id="st-rows"></tbody>
        </table>
      </div>
    </section>

  </main>
  <div class="tooltip" id="tooltip"></div>
  <script src="site.js?v=mx0arl24"></script>
  <script>renderEvent();</script>
</body>
</html>
