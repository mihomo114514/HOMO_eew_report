<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HOMO_eew 推算紀錄</title>
  <link rel="stylesheet" href="site.css?v=mwz849e0" />
</head>
<body>
  <main>
    <header class="site">
      <h1>HOMO_eew 推算紀錄</h1>
      <span class="muted">用 P-Alert 測站資料自動推算，沒有人工檢查；地震資訊請以中央氣象署公布的為準・<a href="stats.html">統計</a></span>
    </header>
    <div class="list-tools">
      <div class="year-tabs" id="years" role="group" aria-label="年份"></div>
      <span style="flex:1"></span>
      <label class="muted">驗證 <select id="f-verdict">
        <option value="">全部</option><option value="real">真地震</option><option value="fake">假事件</option><option value="none">未驗證</option>
      </select></label>
    </div>
    <div class="card">
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>發震時間（推算）</th><th>震央</th><th class="r">規模</th><th class="r">深度</th><th class="r">報數</th>
              <th class="r">中央氣象署</th><th class="r">震央誤差</th><th>驗證</th><th></th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <p class="note" id="status">載入中…</p>
    </div>
  </main>
  <div class="tooltip" id="tooltip"></div>
  <script src="site.js?v=mwz849e0"></script>
  <script>renderIndex();</script>
</body>
</html>
